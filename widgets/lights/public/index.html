<!doctype html>
<html><head><meta charset="utf-8"/>
<style>

  .btn.fill { border-color: var(--lg-brand); background: var(--lg-brand); color: #fff; font-weight: 600; }

  .btn.mood.active { background: var(--lg-brand) !important; color: #fff; }
  .foot { padding: 0 8px 8px; }
  .empty { padding: 14px; color: var(--lg-muted); text-align: center; }
  .panel { margin: 0 8px 8px; border: 2px solid var(--lg-brand); border-radius: 12px; background: var(--lg-card); padding: 8px 10px; }
  .panel .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .panel .hd .t { font-weight: 600; color: var(--lg-brand); flex: 1; }
  .panel .x { border: none; background: none; color: var(--lg-muted); font-size: 16px; cursor: pointer; }

  .hue { -webkit-appearance: none; height: 10px; border-radius: 5px; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .temp { -webkit-appearance: none; height: 10px; border-radius: 5px; background: linear-gradient(to right, #dff4ff, #ffc966); }
</style></head>

    if (a.as) return { lamp: lp, kind: a.as, pos: { x: a.x } };
    if (a.mount === 'surface') {
      if (t === 'floor') return { lamp: lp, kind: 'floor', pos: { x: a.x } };
      if (t === 'ceiling') return { lamp: lp, kind: 'pendant', pos: { x: a.x, drop: a.y - c - 40 } };
      if (t === 'spot') return { lamp: lp, kind: 'spot', pos: { x: a.x } };
      return { lamp: lp, kind: 'table', pos: { x: a.x, y: a.y } };
    }
    if (t === 'ceiling') return { lamp: lp, kind: 'pendant', pos: { x: a.x, drop: a.drop || def.pendDrop || 34 } };
    if (t === 'table') return { lamp: lp, kind: 'table', pos: { x: a.x, y: f } };
    if (t === 'floor') return { lamp: lp, kind: 'floor', pos: { x: a.x } };
    if (t === 'spot') return { lamp: lp, kind: 'spot', pos: { x: a.x } };
    return { lamp: lp, kind: 'bulbHang', pos: { x: a.x } };
  }
  function sceneSvg(zoneLamps, kindName) {
    const def = sceneDef(kindName), f = SC.FLOOR, c = SC.CEIL;
    const byName = (a, b) => String(a.name).localeCompare(String(b.name));
    const placed = [];  // { lamp, kind, pos }
    // an area (or lamp) name matching a scene anchor pins the lamp to that piece of furniture
    const anchors = (def.anchors || []).map((a) => ({ ...a, used: false }));
    const rest = [];
    for (const lp of [...zoneLamps].sort(byName)) {
      const area = lp.zoneName && lp.roomName && lp.zoneName !== lp.roomName ? lp.zoneName : '';
      const hay = (area + ' ' + (lp.name || '')).toLowerCase();
      const a = anchors.find((an) => !an.used && an.re.test(hay));
      if (a) { a.used = true; placed.push(anchorPlace(lp, a, def)); } else rest.push(lp);
    }
    const pend = rest.filter((z) => z.type === 'ceiling');
    const spots = rest.filter((z) => z.type === 'spot');
    const bulbs = rest.filter((z) => !z.type || ['bulb'].includes(z.type));
    const tables = rest.filter((z) => z.type === 'table');
    const floors = rest.filter((z) => z.type === 'floor' || z.type === 'outdoor');
    const walls = rest.filter((z) => z.type === 'wall' || z.type === 'switch');
    const strips = rest.filter((z) => z.type === 'strip');
    // pendants take the scene's free preferred drops first, the rest join the hanging pool
    const freePend = def.pendX.filter((px) => !placed.some((p) => p.pos.x != null && Math.abs(p.pos.x - px) < 30));
    pend.forEach((lp, i) => {
      if (i < freePend.length) placed.push({ lamp: lp, kind: 'pendant', pos: { x: freePend[i], drop: def.pendDrop } });
      else bulbs.push(lp);
    });
    // hanging pool: spots + bulbs, on preferred slots or spread evenly
    const hangPool = [...spots.map((lp) => ({ lamp: lp, kind: 'spot' })), ...bulbs.map((lp) => ({ lamp: lp, kind: lp.type === 'ceiling' ? 'pendant' : 'bulbHang' }))];
    const freeHang = def.hangX.filter((hx) => !placed.some((p) => p.pos.x != null && Math.abs(p.pos.x - hx) < 30));
    const hxs = hangPool.length <= freeHang.length ? freeHang : (hangPool.length <= 4 ? spread(hangPool.length, def.hangSpan[0], def.hangSpan[1]) : spread(hangPool.length, 40, 440));
    hangPool.forEach((h, i) => placed.push({ lamp: h.lamp, kind: h.kind === 'pendant' ? 'bulbHang' : h.kind, pos: { x: hxs[i] } }));
    // table lamps: on furniture surfaces first, overflow stands on the floor
    const floorPool = [];
    const freeSurf = def.surfaces.filter((sf) => !placed.some((p) => p.pos.x != null && Math.abs(p.pos.x - sf.x) < 24));
    tables.forEach((lp, i) => {
      if (i < freeSurf.length) placed.push({ lamp: lp, kind: 'table', pos: freeSurf[i] });
      else floorPool.push({ lamp: lp, kind: 'table' });
    });
    floors.forEach((lp) => floorPool.push({ lamp: lp, kind: lp.type === 'outdoor' ? 'lantern' : 'floor' }));
    const fxs = floorPool.length <= def.floorSlots.length ? def.floorSlots : spread(floorPool.length, 50, 430);
    floorPool.forEach((p, i) => placed.push({ lamp: p.lamp, kind: p.kind === 'table' ? 'table' : p.kind, pos: p.kind === 'table' ? { x: fxs[i], y: f } : { x: fxs[i] } }));
    // wall lamps and switches at mid height near the edges
    const wxs = walls.length <= def.wallX.length ? def.wallX : spread(walls.length, 30, 430);
    walls.forEach((lp, i) => placed.push({ lamp: lp, kind: lp.type === 'switch' ? 'switch' : 'wall', pos: { x: wxs[i], y: c + 52 } }));
    // strips: the scene's strip slot first, others along the floor
    strips.forEach((lp, i) => {
      if (i === 0 && def.stripSlot) placed.push({ lamp: lp, kind: 'strip', pos: def.stripSlot });
      else { const sx = 60 + i * 100; placed.push({ lamp: lp, kind: 'strip', pos: { x1: sx, x2: sx + 80, y: f - 3 } }); }
    });
    const parts = [`<line x1="16" y1="${c}" x2="${SC.W - 16}" y2="${c}" stroke="var(--lg-border)" stroke-width="2"/>`,
      `<line x1="16" y1="${f}" x2="${SC.W - 16}" y2="${f}" stroke="var(--lg-border)" stroke-width="2"/>`, def.furn];
    const cx = (p) => p.kind === 'strip' ? (p.pos.x1 + p.pos.x2) / 2 : p.pos.x;
    placed.sort((a, b) => cx(a) - cx(b));
    let stagger = placed.length > 6;
    for (let gi = 1; gi < placed.length; gi++) if (cx(placed[gi]) - cx(placed[gi - 1]) < 46) stagger = true;
    for (let pi = 0; pi < placed.length; pi++) {
      const p = placed[pi];
      const d = sceneLampSvg(p.lamp, p.kind, p.pos);
      const ly = f + 13 + (stagger && pi % 2 ? 11 : 0);
      const lx = Math.min(Math.max(p.kind === 'strip' ? (p.pos.x1 + p.pos.x2) / 2 : p.pos.x, 24), SC.W - 24);
      const nm = String(p.lamp.name || ''); const short = nm.length > 14 ? nm.slice(0, 13) + '…' : nm;
      parts.push(`<g class="hs${p.lamp.available ? '' : ' unavail'}" onclick="tapLamp('${p.lamp.id}')" onpointerdown="pressStart('${p.lamp.id}')" onpointerup="pressEnd()" onpointerleave="pressEnd()" oncontextmenu="return false">` +
        d.g + `<rect x="${d.hit.x}" y="${d.hit.y}" width="${d.hit.w}" height="${d.hit.h}" fill="transparent" pointer-events="all"/>` +
        `<text x="${lx}" y="${ly}" font-size="8.5" fill="var(--lg-muted)" text-anchor="middle">${esc(short)}</text></g>`);
    }
    return `<svg viewBox="0 0 ${SC.W} ${SC.H}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
  }
  function render() {
    const root = document.getElementById('root');
    const lamps = data.lamps;
    if (!lamps.length) { root.innerHTML = '<div class="empty">No lights selected.</div>'; setH(50); return; }
    if (S.layout === 'room') {
      const rooms = [...new Set(lamps.map((l) => l.room || l.zone))];
      root.innerHTML = rooms.map((z) => {
        const ls = lamps.filter((l) => (l.room || l.zone) === z), on = ls.filter((l) => l.on && l.available).length;
        const moods = S.moods === false ? [] : data.moods.filter((m) => (m.room || m.zone) === z);
        return `<div class="room"><div class="hd"><span class="t">${esc(ls[0].roomName || ls[0].zoneName)}</span><span class="s">${on ? `${on} of ${ls.length} on` : 'all off'}</span></div>` +
          `<div class="scene">${sceneSvg(ls, sceneKind(ls[0].roomName || ls[0].zoneName))}</div>` +
          `<div class="btns">${S.alloff === false ? '' : `<button class="btn brand" onclick="allOff('${z}')">All off</button>`}${moods.map(moodBtn).join('')}</div></div>`;
      }).join('');
      document.getElementById('foot').style.display = 'none';
      setH(document.body.scrollHeight);
    } else {
      const cols = Number(S.columns || 3);
      root.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${cols},1fr)">` + lamps.map((l) =>
        `<div class="card${l.on ? '' : ' off'}${l.available ? '' : ' unavail'}" onclick="tapLamp('${l.id}')" onpointerdown="pressStart('${l.id}')" onpointerup="pressEnd()" onpointerleave="pressEnd()" oncontextmenu="return false"><div class="nm" title="${esc(l.name)}">${esc(l.name)}</div><div class="art">${lampSvg(l, 56)}</div><div class="v">${stateText(l)}</div></div>`).join('') + '</div>';
      document.getElementById('foot').style.display = S.alloff === false ? 'none' : 'block';
      setH(document.body.scrollHeight);
    }
  }
  function setH(h) { if (HomeyRef.setHeight) HomeyRef.setHeight(h); }
  function applyPending(res) {
    const now = Date.now();
    for (const l of res.lamps) {
      const p = pending.get(l.id);
      if (!p) continue;
      if (l.on === p.on || now > p.until) pending.delete(l.id);   // confirmed, or gave up
      else l.on = p.on;                                             // not yet reflected: keep what we asked for
    }
    return res;
  }
  function load(fresh) {
    HomeyRef.api('GET', '/lights?ids=' + encodeURIComponent(ids.join(',')) + '&moods=' + (S.moods === false ? '0' : '1') + (fresh ? '&fresh=1' : ''))
      .then((res) => { data = applyPending(res); render(); if (panelId && !sliding) renderPanel(); })
      .catch((e) => { document.getElementById('root').innerHTML = '<div class="empty">' + esc(e && e.message || e) + '</div>'; });
  }
  // long press opens the controls panel; a short tap toggles
  function pressStart(id) { pressed = false; clearTimeout(pressTimer); pressTimer = setTimeout(() => { pressed = true; openPanel(id); }, 500); }
  function pressEnd() { clearTimeout(pressTimer); }
  function tapLamp(id) { if (pressed) { pressed = false; return; } toggle(id); }
  function openPanel(id) { panelId = id; renderPanel(); }
  function closePanel() { panelId = null; renderPanel(); }
  function renderPanel() {
    const el = document.getElementById('panel');
    const l = panelId && data.lamps.find((x) => x.id === panelId);
    if (!l) { el.style.display = 'none'; el.innerHTML = ''; setH(document.body.scrollHeight); return; }
    let rows = `<div class="r"><label>Power</label><button class="btn ${l.on ? 'fill' : ''}" onclick="setCap('${l.id}','onoff',${!l.on})">${l.on ? 'On' : 'Off'}</button></div>`;
    if (l.hasDim) rows += `<div class="r"><label>Brightness</label><input type="range" min="1" max="100" value="${l.dim == null ? 100 : l.dim}" onchange="setCap('${l.id}','dim',this.value/100)"><span>${l.dim == null ? '' : l.dim + ' %'}</span></div>`;
    const colourMode = l.mode === 'color' || (l.hasColour && !l.hasTemp);
    if (l.hasTemp) rows += `<div class="r${l.hasColour && colourMode ? ' inactive' : ''}"><label>White</label><input class="temp" type="range" min="0" max="100" value="${Math.round((l.temp == null ? 0.5 : l.temp) * 100)}" onchange="setCap('${l.id}','light_temperature',this.value/100)"></div>`;
    if (l.hasColour) rows += `<div class="r${l.hasTemp && !colourMode ? ' inactive' : ''}"><label>Colour</label><input class="hue" type="range" min="0" max="100" value="${Math.round((l.hue == null ? 0 : l.hue) * 100)}" onchange="setColour('${l.id}',this.value/100)"></div>`;
    const moods = S.moods === false ? [] : data.moods.filter((m) => m.zone === l.zone);
    if (moods.length) rows += `<div class="r"><label>Moods</label><span style="display:flex; gap:6px; flex-wrap:wrap">${moods.map(moodBtn).join('')}</span></div>`;
    el.innerHTML = `<div class="hd"><span class="swatch" style="background:${l.on && l.available ? l.colour : '#d1d1d6'}"></span><span class="t">${esc(l.name)}</span><span style="font-size:10px; color:var(--lg-muted)">${esc(l.zoneName)}</span><button class="x" onclick="closePanel()">✕</button></div>${rows}`;
    el.style.display = 'block'; setH(document.body.scrollHeight);
    el.querySelectorAll('input[type=range]').forEach((i) => { i.onpointerdown = () => { sliding = true; }; i.onpointerup = i.onpointercancel = () => { sliding = false; }; });
  }
  function setCap(id, cap, value) { HomeyRef.api('POST', '/set', { id, cap, value }).then(() => setTimeout(() => load(true), 1200)).catch(() => load(true)); }
  function setColour(id, hue) { HomeyRef.api('POST', '/set', { id, cap: 'light_mode', value: 'color' }).catch(() => {}); HomeyRef.api('POST', '/set', { id, cap: 'light_saturation', value: 1 }).catch(() => {}); setCap(id, 'light_hue', hue); }
  function expect(id, on) { pending.set(id, { on, until: Date.now() + 5000 }); const l = data.lamps.find((x) => x.id === id); if (l) l.on = on; }
  function toggle(id) { const l = data.lamps.find((x) => x.id === id); if (!l) return; expect(id, !l.on); render(); HomeyRef.api('POST', '/toggle', { id }).then(() => setTimeout(() => load(true), 1200)).catch(() => load(true)); }
  function allOff(zone) { data.lamps.forEach((l) => { if (!zone || l.zone === zone) expect(l.id, false); }); render(); HomeyRef.api('POST', '/all-off', { ids, zone: zone || null }).then(() => setTimeout(() => load(true), 1500)).catch(() => load(true)); }
  const activeMoods = new Map();   // mood id -> until (shown filled for a moment after pressing)
  function moodBtn(m) {
    const active = (activeMoods.get(m.id) || 0) > Date.now();
    const bg = m.colour ? `background:${m.colour}55;` : '';
    return `<button class="btn mood${active ? ' active' : ''}" style="${bg}" onclick="mood('${m.id}')">${esc(m.name)}</button>`;
  }
  function mood(id) {
    activeMoods.set(id, Date.now() + 2000); render(); if (panelId) renderPanel();
    HomeyRef.api('POST', '/mood', { id })
      .then(() => setTimeout(() => load(true), 1500))
      .catch((e) => { activeMoods.delete(id); const el = document.getElementById('panel'); if (el.style.display !== 'none') el.insertAdjacentHTML('beforeend', `<div class="r" style="color:var(--lg-brand)">${esc(e && e.message || e)}</div>`); load(true); });
    setTimeout(() => { render(); if (panelId) renderPanel(); }, 2100);
  }
  function onHomeyReady(Homey) {
    HomeyRef = Homey; Homey.ready();
    S = Homey.getSettings ? Homey.getSettings() : {};
    ids = (Homey.getDeviceIds && Homey.getDeviceIds()) || [];
    load(); setInterval(() => load(false), 5000);
  }
</script>
</body></html>
