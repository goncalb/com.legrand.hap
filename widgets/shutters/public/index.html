<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  html, body { margin: 0; overflow: hidden; }
  body { font-family: var(--homey-font-family-default, -apple-system, sans-serif); color: var(--homey-text-color, #1c1c1e); }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  .card.sel { border: 2px solid #DA5046; background: #fdf1ef; }
  .card { cursor: pointer; user-select: none; flex: 0 0 calc((100% - 16px) / 3); max-width: calc((100% - 16px) / 3); box-sizing: border-box; border: 0.5px solid var(--homey-color-mono-200, #e3e3e3); border-radius: 10px; padding: 6px 4px; text-align: center; background: var(--homey-color-mono-000, #fff); }
  .card .nm { font-size: 11px; font-weight: 600; color: #DA5046; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 26px; white-space: normal; overflow-wrap: normal; word-break: keep-all; }
  .card .v { font-size: 11px; color: var(--homey-text-color-light, #8a8a8e); }
  .card svg { display: block; margin: 4px auto 2px; }
  .presets { display: flex; gap: 6px; padding: 0 8px 8px; }
  .presets button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid #DA5046; background: transparent; color: #DA5046; font-size: 12px; font-weight: 600; }
  .presets button:active { background: #DA5046; color: #fff; }
  .empty { padding: 14px; font-size: 12px; color: var(--homey-text-color-light, #8a8a8e); text-align: center; }
</style></head>
<body>
<div id="strip" class="strip"></div>
<div id="presets" class="presets" style="display:none">
  <button onclick="preset('open')">Open</button><button onclick="preset('shade')">Shade</button><button onclick="preset('close')">Close</button>
</div>
<div id="hint" style="font-size:10px; color:var(--homey-text-color-light, #8a8a8e); text-align:center; padding:0 8px 8px;"></div>
<script type="text/javascript">
  let HomeyRef, S = {}, ids = [];
  const domId = (id) => String(id).replace(/[^a-zA-Z0-9]/g, '_');
  // Cards are narrow: drop redundant words the widget already implies ("Shutter Window Kitchen" -> "Window Kitchen")
  function shortName(name) {
    const cleaned = String(name).replace(/\b(roller\s+)?(shutters?|blinds?|rolling\s+shutter)\b/gi, '').replace(/\s{2,}/g, ' ').replace(/^[\s\-–·]+|[\s\-–·]+$/g, '').trim();
    return cleaned || name;   // never blank a name that was only "Shutter"
  }
  // Keep room names on one line: a room word is glued to the word before it with a non-breaking space,
  // so "Front Window Living Room" can wrap as "Front Window / Living Room" but never "Living / Room".
  const ROOM_WORDS = ['room', 'bedroom', 'bathroom', 'kitchen', 'office', 'hall', 'hallway', 'lounge', 'study', 'nursery', 'garage', 'terrace', 'balcony', 'suite'];
  function noSplit(name) {
    const words = String(name).split(' ').filter(Boolean);
    const out = [];
    for (const w of words) {
      if (out.length && ROOM_WORDS.includes(w.toLowerCase().replace(/[^a-z]/g, ''))) out[out.length - 1] += '\u00a0' + w;
      else out.push(w);
    }
    return out.join(' ');
  }

  function curtainH(position) { return 44 * Math.max(0, Math.min(100, 100 - position)) / 100; }
  function slatPattern(id, tilt) {
    const gap = tilt == null ? 0.5 : Math.max(0.1, Math.min(0.55, (tilt / 88) * 0.55));
    const slat = 4.5, dark = slat * (1 - gap);
    return '<pattern id="sl-' + domId(id) + '" width="10" height="' + slat + '" patternUnits="userSpaceOnUse"><rect width="10" height="' + dark + '" fill="#c9c9cd"/><rect y="' + dark + '" width="10" height="' + (slat - dark) + '" fill="#f4f4f5"/></pattern>';
  }
  function shutterSvg(d) {
    const h = curtainH(d.position);
    return '<svg viewBox="0 0 60 60" width="56" height="56"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#e9f5ff"/></linearGradient>' + slatPattern(d.id, d.tilt) + '</defs>' +
      '<rect x="6" y="10" width="48" height="46" rx="3" fill="url(#sky)" stroke="#8a8a8e" stroke-width="1.5"/>' +
      '<line x1="30" y1="11" x2="30" y2="55" stroke="#cfd6dd" stroke-width="1.5"/>' +
      '<g class="curtain" id="cu-' + domId(d.id) + '"><rect class="c" x="7.5" y="11" width="45" height="' + h + '" fill="url(#sl-' + domId(d.id) + ')"/><rect class="b" x="7.5" y="' + (11 + h - 2) + '" width="45" height="2.5" fill="#9a9a9e"/></g>' +
      '<rect x="3" y="5" width="54" height="7" rx="2" fill="#b9b9bd"/></svg>';
  }

  /** While the motor reports movement, loop the curtain in the direction of travel until it reports stopped. */
  const FULL_TRAVEL_MS = 20000;   // one full-height pass ≈ a real shutter run (~20 s); partial passes scale with distance
  const loops = new Map();   // id -> { raf, from, to, start }
  function setCurtain(c, b, h) { c.setAttribute('height', h); b.setAttribute('y', 11 + h - 2); }
  function stopLoop(id) { const l = loops.get(id); if (l) { cancelAnimationFrame(l.raf); loops.delete(id); } }
  function animate(d) {
    const g = document.getElementById('cu-' + domId(d.id)); if (!g) return;
    const c = g.querySelector('.c'), b = g.querySelector('.b');
    if (!d.moving) { stopLoop(d.id); setCurtain(c, b, curtainH(d.position)); return; }
    const dir = d.direction || (d.target != null && d.target < d.position ? 'down' : 'up');
    const from = dir === 'down' ? curtainH(d.position) : 44;     // closing: from current down to closed
    const to = dir === 'down' ? 44 : (d.target != null ? curtainH(d.target) : 0);   // opening: from closed up to target
    if (loops.has(d.id)) return;                                   // already looping this card
    // cycle length proportional to the distance travelled, so a full close takes ~28 s per pass, a short hop less
    const cycle = Math.max(4000, Math.abs(to - from) / 44 * FULL_TRAVEL_MS);
    const state = { from, to, start: performance.now() };
    const step = (now) => {
      const t = ((now - state.start) % cycle) / cycle;
      setCurtain(c, b, state.from + (state.to - state.from) * t);
      state.raf = requestAnimationFrame(step);
    };
    state.raf = requestAnimationFrame(step);
    loops.set(d.id, state);
  }

  let anyMoving = false, lastKey = '';
  const selected = new Set();
  function render(list) {
    const filt = list;
    const el = document.getElementById('strip');
    const key = filt.map((d) => d.id).join('|');
    if (key !== lastKey) {   // (re)build cards only when the set changes; otherwise update in place so animations survive
      lastKey = key;
      el.innerHTML = filt.length ? '' : '<div class="empty">No shutters selected.</div>';
      for (const d of filt) {
        el.innerHTML += '<div class="card' + (selected.has(d.id) ? ' sel' : '') + '" id="card-' + domId(d.id) + '" onclick="toggleSel(\'' + d.id + '\')"><div class="nm" title="' + d.name.replace(/"/g, '&quot;') + '">' + noSplit(shortName(d.name)).replace(/</g, '&lt;') + '</div>' + shutterSvg(d) + '<div class="v" id="v-' + domId(d.id) + '"></div></div>';
      }
    }
    anyMoving = false;
    for (const d of filt) {
      const v = document.getElementById('v-' + domId(d.id));
      if (v) v.textContent = d.position + ' %' + (d.tilt != null ? ' · ' + d.tilt + '°' : '') + (d.moving ? (d.direction === 'up' ? ' ↑' : d.direction === 'down' ? ' ↓' : ' ↕') : '');
      const pat = document.getElementById('cu-' + domId(d.id)) && document.getElementById('sl-' + domId(d.id));
      if (pat) pat.outerHTML = slatPattern(d.id, d.tilt);
      animate(d);
      if (d.moving) anyMoving = true;
    }
    document.getElementById('presets').style.display = (S.presets !== false && filt.length) ? 'flex' : 'none';
    updatePresetLabels();
    // height follows the wrapped rows
    const strip = document.getElementById('strip');
    const h = filt.length ? strip.offsetHeight : 50;
    if (HomeyRef.setHeight) HomeyRef.setHeight(h + (S.presets !== false && filt.length ? 64 : 0));
  }
  function load() {
    HomeyRef.api('GET', '/shutters?ids=' + encodeURIComponent(ids.join(','))).then(render).catch((e) => {
      document.getElementById('strip').innerHTML = '<div class="empty">' + String(e && e.message || e).replace(/</g, '&lt;') + '</div>';
      if (HomeyRef.setHeight) HomeyRef.setHeight(70);
    });
  }
  // poll fast while something moves, slowly otherwise
  function schedule() { setTimeout(() => { load(); schedule(); }, anyMoving ? 3000 : 10000); }
  function toggleSel(id) {
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    const c = document.getElementById('card-' + domId(id)); if (c) c.classList.toggle('sel', selected.has(id));
    updatePresetLabels();
  }
  function updatePresetLabels() {
    const n = selected.size;
    document.getElementById('hint').textContent = (n ? (n + ' selected — tap a shutter to deselect') : 'Tap shutters to select — none selected = all');
  }
  function preset(p) {
    // apply to the tapped selection, or to every shown shutter when nothing is selected
    const targets = selected.size ? [...selected] : null;
    const hint = document.getElementById('hint');
    hint.textContent = 'Sending…';
    HomeyRef.api('POST', '/preset', { preset: p, ids, serials: targets, shade: S.shade })
      .then((res) => { hint.textContent = res && res.failed ? ('Failed: ' + res.failed) : 'Sent'; setTimeout(load, 1500); setTimeout(updatePresetLabels, 3000); })
      .catch((e) => { hint.textContent = 'Error: ' + (e && e.message || e); });
  }
  function onHomeyReady(Homey) {
    HomeyRef = Homey; Homey.ready();
    S = Homey.getSettings ? Homey.getSettings() : {};
    ids = (Homey.getDeviceIds && Homey.getDeviceIds()) || [];
    load(); schedule();
  }
</script>
</body></html>
