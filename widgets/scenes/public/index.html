<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  /* dark theme (variant B): cards lighter than the panel, brand lifted for contrast */
  :root { --lg-card: var(--homey-color-mono-000, #fff); --lg-border: var(--homey-color-mono-200, #e3e3e3); --lg-brand: #DA5046; --lg-text: var(--homey-text-color, #1c1c1e); --lg-muted: var(--homey-text-color-light, #8a8a8e); --lg-frame: #8a8a8e; --lg-sel: #fdf1ef; }
  @media (prefers-color-scheme: dark) {
    :root { --lg-card: #3a3a3c; --lg-border: #48484a; --lg-brand: #f0716a; --lg-text: #f2f2f7; --lg-muted: #c7c7cc; --lg-frame: #c7c7cc; --lg-sel: #4a3230; }
  }
  html, body { margin: 0; overflow: hidden; }
  body { font-family: var(--homey-font-family-default, -apple-system, sans-serif); color: var(--lg-text); }
  .grid { display: grid; gap: 8px; padding: 8px; width: 100%; box-sizing: border-box; }
  .tile { background: var(--lg-card); border: 0.5px solid var(--lg-border); border-radius: 12px; padding: 10px 6px;
          text-align: center; cursor: pointer; user-select: none; transition: transform .1s; min-width: 0; overflow: hidden; }
  .tile { border-top: 3px solid var(--lg-brand); }
  .tile:active { transform: scale(.96); background: var(--lg-sel); }
  .tile .ic { font-size: 22px; line-height: 1.1; }
  .tile .nm { font-size: 11px; line-height: 1.25; margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: normal; hyphens: none; }
  .tile.busy { opacity: .5; }
  .empty { padding: 14px; font-size: 12px; color: var(--lg-muted); text-align: center; }
</style></head>
<body>
<div id="grid" class="grid"></div>
<script type="text/javascript">
  function onHomeyReady(Homey) {
    Homey.ready();
    const settings = Homey.getSettings ? Homey.getSettings() : {};
    const cols = Number(settings.columns || 3);
    const picked = [1,2,3,4,5,6].map((i) => settings['scene' + i]).filter((v) => v && v.id).map((v) => v.id);
    const showAll = settings.all !== false || !picked.length;
    const grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    function render(scenes) {
      const list = showAll ? scenes : picked.map((id) => scenes.find((s) => s.id === id)).filter(Boolean);
      grid.innerHTML = list.length ? '' : '<div class="empty">No scenes. Create them in the app settings.</div>';
      for (const s of list) {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = '<div class="ic">' + (s.icon || '🎬') + '</div><div class="nm">' + s.name.replace(/</g, '&lt;').replace(/-/g, '\u2011') + '</div>';
        t.onclick = () => { t.classList.add('busy'); Homey.api('POST', '/run', { id: s.id }).catch((e) => Homey.alert && Homey.alert(e.message)).finally(() => setTimeout(() => t.classList.remove('busy'), 800)); };
        grid.appendChild(t);
      }
      const rows = Math.max(1, Math.ceil(list.length / cols));
      if (Homey.setHeight) Homey.setHeight(rows * 84 + 16);
    }
    Homey.api('GET', '/scenes').then(render).catch(() => render([]));
  }
</script>
</body></html>
